<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ModelEval · 模型评测平台</title>
<link rel="icon" href="/public/favicon.ico">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <div class="brand"><img class="logo" src="/public/logo.png" alt="ModelEval">ModelEval <span class="sub">LLM 评测平台</span></div>
  <nav>
    <button class="tab active" data-view="run">评测运行</button>
    <button class="tab" data-view="providers">供应商管理</button>
    <button class="tab" data-view="history">历史与报告</button>
    <button class="tab" data-view="templates">配置模板</button>
  </nav>
</header>

<main>
  <!-- ============ 评测运行 ============ -->
  <section id="view-run" class="view active">
    <div class="cols-3">
      <div class="panel form-panel">
        <h3>评测配置</h3>

        <div class="group">
          <label>测评任务</label>
          <select id="f-task"></select>
        </div>

        <div class="group">
          <label>模型提供商</label>
          <select id="f-provider"></select>
          <div class="hint" id="provider-hint"></div>
        </div>

        <div class="group" id="key-group">
          <label>API Key <span class="hint-inline">（保存在后端，前端不回传明文）</span></label>
          <div class="row">
            <input type="password" id="f-apikey" placeholder="sk-..." autocomplete="off">
            <button id="btn-save-key" class="ghost">保存Key</button>
          </div>
          <div class="hint" id="key-hint"></div>
        </div>

        <div class="group">
          <label>Base URL 覆盖 <span class="hint-inline">（可选，留空用默认）</span></label>
          <input type="text" id="f-baseurl" placeholder="https://...">
        </div>

        <div class="group">
          <label>模型 <span class="hint-inline">（选择后自动载入参数，可改）</span></label>
          <select id="f-model"></select>
          <div class="hint" id="model-info"></div>
        </div>

        <h4>模型参数</h4>
        <div class="grid3">
          <div class="group"><label>temperature</label><input type="number" id="f-temperature" step="0.1" min="0" max="2" value="0.7"></div>
          <div class="group"><label>top_p</label><input type="number" id="f-top_p" step="0.1" min="0" max="1" value="1.0"></div>
          <div class="group"><label>max_tokens</label><input type="number" id="f-max_tokens" value="4096"></div>
        </div>

        <h4>调度约束</h4>
        <div class="grid3">
          <div class="group"><label>最大调用次数</label><input type="number" id="f-max_calls" value="20"></div>
          <div class="group"><label>累计token上限</label><input type="number" id="f-max_total_tokens" value="200000"></div>
          <div class="group"><label>API超时(秒)</label><input type="number" id="f-api_timeout" value="120"></div>
          <div class="group"><label>失败重试次数</label><input type="number" id="f-retry" value="2"></div>
          <div class="group"><label>调用间隔(秒)</label><input type="number" id="f-min_call_interval" step="0.5" value="0"></div>
          <div class="group"><label>工具调用</label>
            <select id="f-tool_enabled"><option value="1" selected>开启</option><option value="0">关闭</option></select>
          </div>
        </div>

        <h4>任务参数（魔方还原）</h4>
        <div class="grid3">
          <div class="group"><label>最大还原步数</label><input type="number" id="f-max_steps" value="50"></div>
          <div class="group"><label>打乱步数</label><input type="number" id="f-scramble_length" value="20"></div>
        </div>

        <h4>运行</h4>
        <div class="grid3">
          <div class="group"><label>样例数</label><input type="number" id="f-n_cases" value="3" min="1" max="100"></div>
          <div class="group"><label>随机种子 <span class="hint-inline">(空=随机)</span></label><input type="number" id="f-seed" placeholder="自动"></div>
        </div>

        <div class="actions">
          <button id="btn-start" class="primary">开始评测</button>
          <button id="btn-debug" class="ghost">单样例调试</button>
          <span class="spacer"></span>
          <button id="btn-save-template" class="ghost">存为模板</button>
        </div>
      </div>

      <div class="panel mid-panel">
        <div class="run-head">
          <h3>实时监控</h3>
          <div class="run-status">
            <span id="run-badge" class="badge hidden"></span>
            <button id="btn-stop" class="danger hidden">停止</button>
          </div>
        </div>
        <div id="run-progress" class="progress hidden"><div id="run-progress-bar"></div><span id="run-progress-text"></span></div>
        <div id="cube-stage" title="拖拽可旋转视角">
          <div class="cube-pivot" id="cube-pivot">
            <div class="cube-float"><div class="cube-root" id="cube3d"></div></div>
          </div>
          <div id="cube-label"></div>
        </div>
      </div>

      <div class="panel out-panel">
        <h3>评测输出</h3>
        <div id="run-summary" class="run-summary hidden"></div>
        <div id="feed" class="feed"><div class="empty">配置左侧参数后点击「开始评测」，此处实时展示每一轮模型交互。</div></div>
      </div>
    </div>
  </section>

  <!-- ============ 历史与报告 ============ -->
  <section id="view-history" class="view">
    <div class="panel">
      <h3>评测历史</h3>
      <table class="tbl" id="runs-table">
        <thead><tr><th>ID</th><th>任务</th><th>模型</th><th>样例</th><th>状态</th><th>成功率</th><th>费用</th><th>创建时间</th><th></th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </section>

  <!-- ============ 配置模板 ============ -->
  <section id="view-templates" class="view">
    <div class="panel">
      <h3>配置模板</h3>
      <table class="tbl" id="tpl-table">
        <thead><tr><th>名称</th><th>任务</th><th>提供商</th><th>模型</th><th>样例数</th><th>更新时间</th><th></th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </section>
  <!-- ============ 供应商管理 ============ -->
  <section id="view-providers" class="view">
    <div class="panel">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <h3>供应商与模型</h3>
        <button id="btn-add-provider" class="ghost">+ 添加供应商</button>
      </div>
      <table class="tbl" id="providers-table">
        <thead><tr>
          <th>供应商 / 模型</th><th>协议</th><th>端点</th><th>Key</th>
          <th>上下文</th><th>命中价</th><th>未命中价</th><th>输出价</th><th>多模态</th><th></th>
        </tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </section>

  <!-- ============ 对话框 ============ -->
  <dialog id="dlg-template">
    <h3>存为配置模板</h3>
    <div class="group"><label>模板名称</label><input id="tpl-name" placeholder="如 DeepSeek-R1 严格模式"></div>
    <div class="actions"><span class="spacer"></span>
      <button id="tpl-cancel" class="ghost">取消</button>
      <button id="tpl-save" class="primary">保存</button>
    </div>
  </dialog>

  <dialog id="dlg-provider">
    <h3 id="dlg-provider-title">供应商信息</h3>
    <div class="group"><label>供应商 ID（唯一，如 glm）</label><input id="pf-id" placeholder="glm"></div>
    <div class="group"><label>名称</label><input id="pf-name" placeholder="智谱 GLM"></div>
    <div class="group"><label>协议格式</label>
      <select id="pf-protocol"><option value="openai">OpenAI 兼容</option><option value="anthropic">Anthropic</option></select>
    </div>
    <div class="group"><label>Base URL</label><input id="pf-baseurl" placeholder="https://...（可留空用默认）"></div>
    <div class="group"><label>API Key <span class="hint-inline">（保存在后端，不回传明文）</span></label>
      <input id="pf-apikey" type="password" placeholder="sk-...（留空则不修改）" autocomplete="off"></div>
    <div class="actions"><span class="spacer"></span>
      <button id="pf-cancel" class="ghost">取消</button>
      <button id="pf-save" class="primary">保存</button>
    </div>
  </dialog>

  <dialog id="dlg-model">
    <h3>模型信息 <span class="hint-inline">（所属供应商：<span id="mf-provider"></span>）</span></h3>
    <div class="group"><label>模型名称 / 标识</label><input id="mf-name" placeholder="如 glm-4.6"></div>
    <div class="grid3">
      <div class="group"><label>命中输入价(元/百万)</label><input id="mf-ch" type="number" step="0.01" value="0"></div>
      <div class="group"><label>未命中输入价(元/百万)</label><input id="mf-cm" type="number" step="0.01" value="0"></div>
      <div class="group"><label>输出价(元/百万)</label><input id="mf-co" type="number" step="0.01" value="0"></div>
      <div class="group"><label>上下文长度</label><input id="mf-ctx" type="number" value="1000000"></div>
      <div class="group"><label>temperature</label><input id="mf-temp" type="number" step="0.1" value="0.7"></div>
      <div class="group"><label>top_p</label><input id="mf-topp" type="number" step="0.1" value="1.0"></div>
      <div class="group"><label>max_tokens</label><input id="mf-maxtok" type="number" value="4096"></div>
      <div class="group"><label>支持多模态</label>
        <select id="mf-multi"><option value="0">否</option><option value="1">是</option></select>
      </div>
    </div>
    <div class="actions"><span class="spacer"></span>
      <button id="mf-cancel" class="ghost">取消</button>
      <button id="mf-save" class="primary">保存</button>
    </div>
  </dialog>

</main>

<script src="/static/cube3d.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
